name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-backend:
    name: Build Backend
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: postgresql://ci_user:ci_pass@localhost:5432/ci_db
      PORT: 5050

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Start backend to verify it boots
        shell: pwsh
        run: |
          $proc = Start-Process npm -ArgumentList "start" -PassThru
          Start-Sleep -Seconds 10
          if ($null -eq (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)) {
            Write-Error "Le backend s'est arrêté immédiatement."
            exit 1
          }
          Stop-Process -Id $proc.Id -Force

  build-frontend:
    name: Build Frontend
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build production
        run: npm run build