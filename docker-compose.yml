services:
  db:
    image: postgres:16-alpine
    container_name: gym-db
    environment:
      POSTGRES_DB: gym_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: gym-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/gym_management
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: gym-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data: